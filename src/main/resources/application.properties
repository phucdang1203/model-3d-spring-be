# ===============================
# APPLICATION
# ===============================
spring.application.name=model-3d-spring-be
spring.profiles.active=local
spring.config.import=optional:classpath:resources-env/${spring.profiles.active}/application.properties
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
server.port=8778

# ===============================
# SWAGGER (Springdoc)
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.innervix.model3d
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.default-consumes-media-type=application/json;charset=UTF-8
springdoc.default-produces-media-type=application/json;charset=UTF-8
springdoc.cache.disabled=true
springdoc.api-docs.groups.enabled=true
swagger.openapi.web-url=http://localhost:${server.port}

# ===============================
# DATABASE / SQL INIT
# ===============================
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:db/schema.sql

# ===============================
# HIKARI POOL
# ===============================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.pool-name=Model3dHikariCP

# ===============================
# MYBATIS
# ===============================
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.innervix.model3d
mybatis.type-handlers-package=com.innervix.model3d.common.mybatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===============================
# LOGGING
# ===============================
logging.config=classpath:log4j2-spring.xml
logging.level.root=INFO
logging.level.org.apache.ibatis=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.com.innervix.model3d=DEBUG

# ===============================
# MESSAGE
# ===============================
spring.messages.cache-duration=-1

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=600MB
app.upload-dir=upload-files

# ===============================
# SECURITY
# ===============================
app.security.enabled=false
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:change-this-development-secret-change-this-development-secret}
app.security.token-validity-seconds=86400
app.security.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.security.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin}
